---
commando_linux_agent_install_dir: /opt/commando
commando_linux_agent_config_dir: /etc/commando
commando_linux_agent_state_dir: /var/lib/commando
commando_linux_agent_log_dir: /var/log/commando
commando_linux_agent_user: root
commando_linux_agent_group: root
commando_linux_agent_service_name: commando-agent
commando_allow_unrestricted_powershell: false
commando_services: []
commando_allowed_hash_roots: []
commando_tls_ca_source: ''
commando_poll_seconds: 5
commando_task_timeout_seconds: 90
commando_max_powershell_output_bytes: 131072
commando_enabled_powershell_commands: []
commando_allowed_cidrs: []
commando_linux_runtime_packages:
  - ca-certificates
  - libc6
  - libgcc-s1
  - libgssapi-krb5-2
  - libicu70
  - libssl3
  - libstdc++6
  - zlib1g

