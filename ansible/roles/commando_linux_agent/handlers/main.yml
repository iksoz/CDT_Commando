---
- name: Update Linux CA certificates
  ansible.builtin.command:
    argv:
      - update-ca-certificates
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Commando Linux agent
  ansible.builtin.systemd_service:
    name: "{{ commando_linux_agent_service_name }}"
    state: restarted

