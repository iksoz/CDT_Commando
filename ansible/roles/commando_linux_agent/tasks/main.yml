---
- name: Validate Linux agent deployment inputs
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('22.04', '==')
      - commando_agent_name is defined
      - commando_agent_name | length > 0
      - commando_server_url is match('^https://')
      - not commando_allow_unrestricted_powershell | bool
    fail_msg: >-
      Linux agents require Ubuntu 22.04, an agent name, an HTTPS URL, and
      unrestricted PowerShell disabled.

- name: Install Linux runtime dependencies
  ansible.builtin.apt:
    name: "{{ commando_linux_runtime_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check Linux agent artifact on the controller
  ansible.builtin.stat:
    path: "{{ commando_linux_agent_artifact }}"
  delegate_to: localhost
  become: false
  register: commando_linux_agent_artifact_stat

- name: Require Linux agent artifact
  ansible.builtin.assert:
    that: commando_linux_agent_artifact_stat.stat.exists
    fail_msg: The bundled Linux agent artifact is missing.

- name: Check optional TLS CA certificate on the controller
  ansible.builtin.stat:
    path: "{{ commando_tls_ca_source }}"
  delegate_to: localhost
  become: false
  register: commando_linux_ca_stat
  when: commando_tls_ca_source | default('') | length > 0

- name: Require configured TLS CA certificate
  ansible.builtin.assert:
    that: commando_linux_ca_stat.stat.exists
    fail_msg: Set commando_tls_ca_source to an existing CA certificate or to an empty string.
  when: commando_tls_ca_source | default('') | length > 0

- name: Create custom Linux agent group
  ansible.builtin.group:
    name: "{{ commando_linux_agent_group }}"
    system: true
    state: present
  when: commando_linux_agent_group != 'root'

- name: Create custom Linux agent user
  ansible.builtin.user:
    name: "{{ commando_linux_agent_user }}"
    group: "{{ commando_linux_agent_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  when: commando_linux_agent_user != 'root'

- name: Create Linux agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ commando_linux_agent_install_dir }}"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ commando_linux_agent_config_dir }}"
      owner: root
      group: "{{ commando_linux_agent_group }}"
      mode: '0750'
    - path: "{{ commando_linux_agent_state_dir }}"
      owner: "{{ commando_linux_agent_user }}"
      group: "{{ commando_linux_agent_group }}"
      mode: '0750'
    - path: "{{ commando_linux_agent_log_dir }}"
      owner: "{{ commando_linux_agent_user }}"
      group: "{{ commando_linux_agent_group }}"
      mode: '0750'
    - path: "{{ commando_linux_agent_log_dir }}/transcripts"
      owner: "{{ commando_linux_agent_user }}"
      group: "{{ commando_linux_agent_group }}"
      mode: '0750'

- name: Install Linux agent binary
  ansible.builtin.copy:
    src: "{{ commando_linux_agent_artifact }}"
    dest: "{{ commando_linux_agent_install_dir }}/Commando.Agent"
    owner: root
    group: root
    mode: '0755'
  notify: Restart Commando Linux agent

- name: Install Commando TLS CA certificate
  ansible.builtin.copy:
    src: "{{ commando_tls_ca_source }}"
    dest: /usr/local/share/ca-certificates/commando-ca.crt
    owner: root
    group: root
    mode: '0644'
  when: commando_tls_ca_source | default('') | length > 0
  notify:
    - Update Linux CA certificates
    - Restart Commando Linux agent

- name: Render protected Linux agent configuration
  ansible.builtin.template:
    src: agent.json.j2
    dest: "{{ commando_linux_agent_config_dir }}/agent.json"
    owner: root
    group: "{{ commando_linux_agent_group }}"
    mode: '0640'
  no_log: true
  notify: Restart Commando Linux agent

- name: Install systemd unit
  ansible.builtin.template:
    src: commando-agent.service.j2
    dest: "/etc/systemd/system/{{ commando_linux_agent_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Commando Linux agent

- name: Enable and start Linux agent
  ansible.builtin.systemd_service:
    name: "{{ commando_linux_agent_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Linux agent changes before verification
  ansible.builtin.meta: flush_handlers

- name: Verify Linux agent remains active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ commando_linux_agent_service_name }}"
  changed_when: false
  register: commando_linux_agent_status
  retries: 5
  delay: 2
  until: commando_linux_agent_status.stdout == 'active'
  when: not ansible_check_mode

- name: Verify Linux agent enrollment state exists
  ansible.builtin.stat:
    path: "{{ commando_linux_agent_state_dir }}/agent-state.json"
  register: commando_linux_agent_enrollment
  retries: 15
  delay: 2
  until: commando_linux_agent_enrollment.stat.exists
  when: not ansible_check_mode

