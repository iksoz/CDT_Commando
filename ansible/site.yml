---
- name: Prepare self-contained Commando deployment material
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: commando_prepare

- name: Install the Commando server
  hosts: commando_servers
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: commando_server

- name: Install Commando agents on Linux
  hosts: linux_agents
  gather_facts: true
  become: true
  roles:
    - role: commando_linux_agent

- name: Install Commando agents on Windows
  hosts: windows_agents
  gather_facts: true
  roles:
    - role: commando_windows_agent

- name: Report Commando deployment details
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Show dashboard and local operator-key path
      ansible.builtin.debug:
        msg:
          - "Dashboard: {{ commando_server_url }}"
          - "Operator key: {{ commando_generated_dir }}/operator-key"

